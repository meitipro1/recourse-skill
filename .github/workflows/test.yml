name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp:
    name: MCP server types and read only tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: dependencies
        run: npm ci
      - name: types
        run: npm run typecheck
      - name: read only tests
        run: npm test
